  /auth/logout:
    parameters:
    - $ref: '#/components/parameters/LoginRole'
    post:
      tags:
      - 认证
      summary: 登出
      operationId: logout
      description: '无请求体。有效Session及所选身份的CSRF下退出该身份；另一角色仍登录时保留Session和Cookie，两种身份均退出时销毁Session并清除Cookie。用户退出关闭其SSE并撤销临时媒体访问，已有RUNNING演绎按主动离开规则收敛，成功报告不受影响；管理员退出不影响用户演绎。所选身份已退出时返回401，客户端按已登出处理。


        需求依据：PRD§8.1、BR-P11、PER-01～04；本轮Cookie Session+CSRF确认'
      security:
      - SessionCookie: []
        CsrfHeader: []
      x-access-roles:
      - USER
      - ADMIN
      x-owner-check: false
      x-requirement-refs:
      - PRD§8.1、BR-P11、PER-01～04
      - 本轮Cookie Session+CSRF确认
      responses:
