                    code: CSRF_INVALID
                    message: CSRF校验失败，请重新获取令牌
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNSUPPORTED_MEDIA_TYPE:
                  summary: 不支持的请求或图片格式
                  value:
                    code: UNSUPPORTED_MEDIA_TYPE
                    message: 不支持的请求或图片格式
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '409':
          description: USERNAME_TAKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USERNAME_TAKEN:
                  summary: 用户名已被使用
