                  value:
                    code: UNAUTHENTICATED
                    message: 请重新登录
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '403':
          description: FORBIDDEN / CSRF_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  summary: 当前角色无权访问
                  value:
                    code: FORBIDDEN
                    message: 当前角色无权访问
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
                CSRF_INVALID:
                  summary: CSRF校验失败，请重新获取令牌
                  value:
                    code: CSRF_INVALID
                    message: CSRF校验失败，请重新获取令牌
