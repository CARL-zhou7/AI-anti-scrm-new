          - PAYMENT
          - REFUND
          - REWARD
          - RESERVE_RELEASE
        purpose:
          type: string
          description: 与type组合一致
          enum:
          - INITIAL_PAYMENT
          - ADDITIONAL_PAYMENT
          - INVESTMENT_PAYMENT
          - EXTRA_FEE_PAYMENT
          - LOAN_TRANSFER
          - OTHER_PAYMENT
          - REFUND
          - REWARD
          - RESERVE_RELEASE
