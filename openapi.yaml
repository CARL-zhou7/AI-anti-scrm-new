              description: no-store
        '503':
          description: SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAVAILABLE:
                  summary: 服务暂不可用
                  value:
