    PresentationReceipt:
      type: object
      description: FAILED必须带errorCode；COMPLETED不得带errorCode；不接受客户端结局、风险或时间作为完成依据
      properties:
        status:
          type: string
          description: 只上报呈现事实
          enum:
          - COMPLETED
          - FAILED
        errorCode:
          $ref: '#/components/schemas/PresentationError'
      required:
      - status
      additionalProperties: false
      allOf:
      - if:
          properties:
            status:
              const: FAILED
        then:
          required:
          - errorCode
      - if:
          properties:
            status:
              const: COMPLETED
        then:
          not:
            required:
            - errorCode
      examples:
      - status: COMPLETED
    ExitRequest:
      type: object
      description: 仅主动离开，不接受任意中断码
      properties:
        reason:
          type: string
          description: 客户端可观测的离开动作；服务端统一核定USER_EXIT
          enum:
          - NAVIGATION
          - REFRESH
          - CLOSE
          - LOGOUT
      required:
      - reason
      additionalProperties: false
      examples:
      - reason: NAVIGATION
    Outcome:
      type: object
      description: 只在FINISHED返回；实际结局优先于上限
      properties:
        code:
          $ref: '#/components/schemas/OutcomeCode'
        displayText:
          type: string
          description: 结局中文展示名
        reason:
          type: string
          description: 已保存结局依据
        limitReason:
          anyOf:
          - type: string
            description: 仅UNDETERMINED具有上限原因
            enum:
            - ROUND_LIMIT
            - TIME_LIMIT
            - BOTH
          - type: 'null'
      required:
      - code
      - displayText
      - reason
      - limitReason
      additionalProperties: false
      examples:
      - code: NOT_DEFRAUDED
        displayText: 未受骗结束
        reason: 受害者拒绝转账并停止配合，未发生实际受骗行为。
        limitReason: null
      allOf:
      - if:
          properties:
            code:
              const: UNDETERMINED
        then:
          properties:
            limitReason:
              type: string
        else:
          properties:
            limitReason:
              type: 'null'
