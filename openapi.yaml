        canRetry: false
        attemptNo: 0
        updatedAt: '2026-10-15T02:00:20.000Z'
        error: null
      allOf:
      - if:
          properties:
            status:
              const: PENDING
        then:
          properties:
            displayText:
              const: 生成中
            canRetry:
              const: false
            error:
              type: 'null'
      - if:
          properties:
            status:
              const: RUNNING
        then:
          properties:
            displayText:
              const: 生成中
            canRetry:
              const: false
            error:
              type: 'null'
      - if:
          properties:
            status:
              const: SUCCEEDED
        then:
          properties:
            displayText:
              const: 已完成
            canRetry:
              const: false
            error:
              type: 'null'
      - if:
          properties:
            status:
              const: FAILED
        then:
          properties:
            displayText:
              const: 生成失败
            canRetry:
              const: true
            error:
              $ref: '#/components/schemas/ReportError'
