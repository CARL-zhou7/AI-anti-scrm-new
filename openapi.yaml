  /auth/logout:
    post:
      tags:
      - 认证
      summary: 登出
      operationId: logout
      description: '无请求体。有效Session及CSRF下销毁当前Session、清除Cookie，关闭其SSE并撤销临时媒体访问。已有RUNNING演绎按主动离开规则收敛，成功报告不受影响。重复请求若Session已失效返回401，客户端按已登出处理。


        需求依据：PRD§8.1、BR-P11、PER-01～04；本轮Cookie Session+CSRF确认'
      security:
      - SessionCookie: []
        CsrfHeader: []
      x-access-roles:
      - USER
      - ADMIN
      x-owner-check: false
      x-requirement-refs:
      - PRD§8.1、BR-P11、PER-01～04
      - 本轮Cookie Session+CSRF确认
      responses:
        '200':
          description: 成功；业务载荷见LogoutResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResultResponse'
              example:
                code: OK
                message: 成功
                data:
                  loggedOut: true
                requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
