      description: '确认当前轮活动草稿：原样继续采用已经生成或修订校验的已保存草稿，仅提交不同的新改写时重新校验内容；在会话锁内复核draftId与expectedRevisionNo，保存为骗子正式消息并进入呈现与受害者生成。
        请求字段continue为Java关键字，线上字段名固定为continue。同一草稿重复采用且含义一致时返回既有状态且不重复生成受害者；同ID不同最终内容返回409 IDEMPOTENCY_CONFLICT。
        未确认期间正式消息为空，刷新按USER_EXIT处理。'
