openapi: 3.1.0
info:
  title: AI反诈情景推演平台接口文档
  version: 1.4.0
  x-admin-demo-routing:
    basePath: /admin/simulations
    description: 管理员演示复用 /simulations 的启动、单场状态、呈现回执、暂停/恢复、退出、逐轮干预、SSE、音频和报告契约；使用管理员 Session 与管理员 CSRF。列表和历史详情不提供管理员别名，所有单场接口仍校验本人归属。
  description: 44项正式HTTP操作、11类SSE事件（V1.4：PRD-V3.5固定15轮与SCAMMER_WIN/VICTIM_WIN判定、trust-v3整轮证据与多条反证、取消业务截止、报告contentSchemaVersion 4、三栏解说methodShort/intentShort与观看者可见的真实受骗倾向变化；保留V1.3信任策略、V1.2画像/资金/报告v1-v3与Qwen语音）。StartRequest.timing已改为可选。
servers:
- url: /anti.scam/v1
  description: 前后端同源HTTPS；部署域名另行配置
security:
- SessionCookie: []
  CsrfHeader: []
tags:
- name: 认证
- name: 首页
- name: 配置
- name: 演绎
- name: 复盘与历史
- name: 管理
- name: 计时
paths:
  /auth/csrf:
    parameters:
    - $ref: '#/components/parameters/LoginRole'
    get:
      tags:
      - 认证
      summary: 获取CSRF令牌
      operationId: getCsrf
      description: '允许匿名与已登录调用；绑定当前Session，必要时创建匿名Session。Cache-Control: no-store。重取不登录、不切换角色。


        需求依据：PRD§8.1、BR-P11、PER-01～04；本轮Cookie Session+CSRF确认'
      security: []
      x-access-roles:
      - PUBLIC
      x-owner-check: false
      x-requirement-refs:
      - PRD§8.1、BR-P11、PER-01～04
      - 本轮Cookie Session+CSRF确认
      responses:
        '200':
          description: 成功；业务载荷见CsrfToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
              example:
                code: OK
                message: 成功
                data:
                  token: csrf-example-not-a-real-token
                  headerName: X-CSRF-TOKEN
                requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
            Set-Cookie:
              schema:
                type: string
              description: JSESSIONID=<opaque>; Path=/anti.scam/v1; HttpOnly; Secure; SameSite=Lax。CSRF获取仅必要时建立匿名会话；登录轮换标识；登出同Path清除Cookie。
        '400':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 请求字段不符合规则
                  value:
                    code: VALIDATION_FAILED
                    message: 请求字段不符合规则
                    data:
                      fieldErrors:
                      - field: $
                        code: VALUE_INVALID
                        message: 字段值不符合接口约定
                      activeSessionId: null
                      currentVersion: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  summary: 服务暂时无法完成请求
                  value:
                    code: INTERNAL_ERROR
                    message: 服务暂时无法完成请求
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '503':
          description: SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAVAILABLE:
                  summary: 服务暂不可用
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: 服务暂不可用
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
