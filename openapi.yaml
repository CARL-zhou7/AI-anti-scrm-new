              ANALYZING, ANALYSIS_PRESENTING, COMPLETE]
          - type: 'null'
          description: 开场currentRoundNo=0时为null
        currentDraft:
          anyOf:
          - $ref: '#/components/schemas/ScammerDraft'
          - type: 'null'
          description: 仅SCAMMER_REVIEW时非null
        pendingInterventionCount:
          type: integer
          minimum: 0
        canRegenerate:
          type: boolean
        canAdopt:
          type: boolean
      required: [sessionId, interventionMode, currentRoundNo, phase, currentDraft, pendingInterventionCount,
        canRegenerate, canAdopt]
      additionalProperties: false
    DraftRequest:
      type: object
      description: 修改或重新生成的请求（V1.4 API-49）
      properties:
        draftId:
          $ref: '#/components/schemas/Id'
        expectedRevisionNo:
          type: integer
          minimum: 0
        guidance:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
        content:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 120
          - type: 'null'
      required: [draftId, expectedRevisionNo]
      additionalProperties: false
    AdoptRequest:
      type: object
      description: 采用请求（V1.4 API-48）；continue是Java关键字，线上字段名固定为continue
      properties:
        draftId:
          $ref: '#/components/schemas/Id'
        expectedRevisionNo:
          type: integer
          minimum: 0
        continue:
          type: boolean
          description: 继续采用当前草稿
        content:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 120
          - type: 'null'
          description: 直接在采用时改写；与草稿一致即沿用草稿
      required: [draftId, expectedRevisionNo, continue]
      additionalProperties: false
    InterventionDraftEvent:
      type: object
      description: （V1.4）ADMIN_TEST场次的草稿已保存，等待本人确认；内测期间USER与ADMIN场次均可收到该事件
      properties:
        eventId:
          type: string
        sessionId:
          $ref: '#/components/schemas/Id'
        stateVersion:
          $ref: '#/components/schemas/StateVersion'
        data:
          type: object
          properties:
            roundNo:
              type: integer
              minimum: 1
              maximum: 20
            draft:
              $ref: '#/components/schemas/ScammerDraft'
            pendingInterventionCount:
              type: integer
              minimum: 0
          required: [roundNo, draft, pendingInterventionCount]
          additionalProperties: false
      required: [eventId, sessionId, stateVersion, data]
      additionalProperties: false
    InterventionRecord:
      type: object
      description: 一条已采用干预的可追溯记录（V1.4 API-50/55）；ADOPTED表示待入库，LINKED表示已归入某条场景规则。ruleId只在按规则查询来源时非空
      properties:
        previousContext:
          description: 上一轮双方的已保存对话
          type: [string, 'null']
        interventionId:
          $ref: '#/components/schemas/Id'
        sessionId:
          $ref: '#/components/schemas/Id'
        sourceSessionId:
          $ref: '#/components/schemas/Id'
        roundNo:
          type: integer
          minimum: 1
          maximum: 20
        sceneCode:
          type: string
          enum: [TASK_REBATE, FAKE_INVESTMENT, IMPERSONATION_LOAN]
        originalContent:
          type: string
          minLength: 1
        finalContent:
          type: string
          minLength: 1
        interventionNote:
          type:
          - string
          - 'null'
        status:
          type: string
          enum: [PENDING, ADOPTED, LINKED]
        createdAt:
          $ref: '#/components/schemas/UtcMillis'
        ruleId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required: [interventionId, sessionId, sourceSessionId, roundNo, sceneCode, originalContent, finalContent,
        interventionNote, status, createdAt, ruleId]
      additionalProperties: false
    RuleDraft:
      type: object
      description: 归纳得到的规则草稿（API-51）；只读提案，提交前不写库也不改变来源状态
      properties:
        scenarioCode:
          type: string
          enum: [TASK_REBATE, FAKE_INVESTMENT, IMPERSONATION_LOAN]
        title:
          type: string
          minLength: 1
          maxLength: 128
        ruleText:
          type: string
          minLength: 1
        sourceInterventionIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Id'
      required: [scenarioCode, title, ruleText, sourceInterventionIds]
      additionalProperties: false
    SceneRuleWrite:
      type: object
      description: 新建角色场景规则；默认SCAMMER，两个角色均可直接编写。SCAMMER可选关联干预来源，VICTIM来源为空。仅影响新场次。
      properties:
        targetRole:
          type: string
          enum: [SCAMMER, VICTIM]
          default: SCAMMER
        scenarioCode:
          type: string
          enum: [TASK_REBATE, FAKE_INVESTMENT, IMPERSONATION_LOAN]
        title:
          type: string
          minLength: 1
          maxLength: 128
        ruleText:
          type: string
          minLength: 1
          maxLength: 4000
        sourceInterventionIds:
          type: array
          minItems: 0
          maxItems: 50
          items:
            $ref: '#/components/schemas/Id'
      required: [scenarioCode, title, ruleText]
      allOf:
      - if:
          required: [targetRole]
          properties:
            targetRole:
              const: VICTIM
        then:
          properties:
            sourceInterventionIds:
              maxItems: 0
      additionalProperties: false
    SceneRuleUpdate:
      type: object
      description: 编辑或启停（API-54）；version不匹配返回409 VERSION_CONFLICT，编辑与启停都会提升版本号
      properties:
        title:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        ruleText:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 4000
          - type: 'null'
        status:
          anyOf:
          - type: string
            enum: [ENABLED, DISABLED]
          - type: 'null'
        version:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      additionalProperties: false
    SceneRule:
      type: object
      description: 场景规则（API-52～54）；规则按场景生效，只影响之后新开的同场景场次
      properties:
        targetRole:
          type: string
          enum: [SCAMMER, VICTIM]
        ruleId:
          $ref: '#/components/schemas/Id'
        scenarioCode:
          type: string
          enum: [TASK_REBATE, FAKE_INVESTMENT, IMPERSONATION_LOAN]
        title:
          type: string
          minLength: 1
          maxLength: 128
        ruleText:
          type: string
          minLength: 1
          maxLength: 4000
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [ENABLED, DISABLED]
        sourceCount:
          type: integer
          minimum: 0
        updatedAt:
          $ref: '#/components/schemas/UtcMillis'
      required: [targetRole, ruleId, scenarioCode, title, ruleText, version, status, sourceCount, updatedAt]
      additionalProperties: false
    SceneRulePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SceneRule'
      required: [items]
      additionalProperties: false
    SessionResumedEvent:
      type: object
      description: （V1.1）继续演绎已保存：本次计入的暂停时长已顺延到deadlineAt与当前readingUntil。
      properties:
        eventId:
          type: string
          description: 不透明事件标识；同次推送重发保持，快照可产生新标识
        sessionId:
          $ref: '#/components/schemas/Id'
        stateVersion:
          $ref: '#/components/schemas/StateVersion'
        data:
          $ref: '#/components/schemas/SimulationState'
      required:
      - eventId
      - sessionId
      - stateVersion
      - data
      additionalProperties: false
