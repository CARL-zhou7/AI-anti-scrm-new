            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
              example:
                code: OK
                message: 成功
                data:
                  account:
                    id: '101'
                    username: 示例用户_01
                    role: USER
                  nextAction: LOGIN
                requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '400':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 请求字段不符合规则
                  value:
                    code: VALIDATION_FAILED
                    message: 请求字段不符合规则
                    data:
                      fieldErrors:
                      - field: username
                        code: VALUE_INVALID
                        message: 字段值不符合接口约定
                      activeSessionId: null
                      currentVersion: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '403':
