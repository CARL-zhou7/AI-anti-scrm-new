      summary: 查询本人待入库干预记录（API-50）
      operationId: listWaitingInterventions
      description: '仅ADMIN。默认返回本人演示测试场次中已采用（ADOPTED）且尚未归入规则的记录；ruleId非空时改为返回该规则下本人的来源记录。
        其他管理员与普通用户的记录永不返回；响应不含内部提示、阈值或计分系数。'
