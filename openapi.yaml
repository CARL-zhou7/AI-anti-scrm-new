x-timing-protocol:
  status: 已冻结，纳入正式契约（GET /timing/samples 与 StartRequest.timing）；V-02/V-03 运行参数仍待实测
  samplingOperation: GET /anti.scam/v1/timing/samples
  flow:
  - 已登录配置页采样并绑定当前Session
  - 同一performance时间原点记录发送/接收/点击
  - 开始请求重发保留原点击和样本
  - 服务端核对样本绑定/有效期/预算后建立startedAt与固定deadlineAt（startedAt+600秒）
  rejectedWhen:
  - 样本缺失、过期或不属于当前Session
  - 不满足发送≤接收≤点击
  - 偏移与不确定性超出已锁定范围
  unresolvedRuntimeParameters:
  - 样本有效期取值、采样次数和最大可接受误差（TBD-01a）
  - 刷新后时间原点改变和多标签绑定（TBD-05）
  - 临界提交、网络完全失联和浏览器挂起的可满足性（V-02/V-03）
  implementationGate: 协议字段与校验顺序已冻结，可按本契约实现开始链路；不得用receivedAt重新发放完整600秒。
