openapi: 3.1.0
info:
  title: AI反诈情景推演平台接口文档
  version: 1.0.0
  description: 42项正式HTTP操作、9类SSE事件。设计契约，不代表已有服务实现或验证通过。点击计时协议已冻结（API-42 + StartRequest.timing）；V-02/V-03运行参数仍待实测。
servers:
- url: /anti.scam/v1
  description: 前后端同源HTTPS；部署域名另行配置
security:
- SessionCookie: []
  CsrfHeader: []
tags:
- name: 认证
- name: 首页
- name: 配置
- name: 演绎
- name: 复盘与历史
- name: 管理
- name: 计时
paths:
  /auth/csrf:
    get:
      tags:
      - 认证
      summary: 获取CSRF令牌
      operationId: getCsrf
      description: '允许匿名与已登录调用；绑定当前Session，必要时创建匿名Session。Cache-Control: no-store。重取不登录、不切换角色。


        需求依据：PRD§8.1、BR-P11、PER-01～04；本轮Cookie Session+CSRF确认'
      security: []
      x-access-roles:
      - PUBLIC
      x-owner-check: false
      x-requirement-refs:
      - PRD§8.1、BR-P11、PER-01～04
      - 本轮Cookie Session+CSRF确认
      responses:
        '200':
          description: 成功；业务载荷见CsrfToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
              example:
                code: OK
                message: 成功
                data:
                  token: csrf-example-not-a-real-token
                  headerName: X-CSRF-TOKEN
                requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
            Set-Cookie:
              schema:
                type: string
              description: JSESSIONID=<opaque>; Path=/anti.scam/v1; HttpOnly; Secure; SameSite=Lax。CSRF获取仅必要时建立匿名会话；登录轮换标识；登出同Path清除Cookie。
        '400':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 请求字段不符合规则
                  value:
                    code: VALIDATION_FAILED
                    message: 请求字段不符合规则
                    data:
                      fieldErrors:
                      - field: $
                        code: VALUE_INVALID
                        message: 字段值不符合接口约定
                      activeSessionId: null
                      currentVersion: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  summary: 服务暂时无法完成请求
                  value:
                    code: INTERNAL_ERROR
                    message: 服务暂时无法完成请求
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '503':
          description: SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAVAILABLE:
                  summary: 服务暂不可用
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: 服务暂不可用
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
  /auth/register:
    post:
      tags:
      - 认证
      summary: 普通用户注册
      operationId: register
      description: '只创建USER；不得提交role。注册成功仍未登录，返回登录页。密码和确认密码按原样比较。重复提交命中同名账号返回409，不重复建号。


        需求依据：PRD§8.1、BR-P11、PER-01～04；本轮Cookie Session+CSRF确认'
      security:
      - SessionCookie: []
        CsrfHeader: []
      x-access-roles:
      - PUBLIC
      x-owner-check: false
      x-requirement-refs:
      - PRD§8.1、BR-P11、PER-01～04
      - 本轮Cookie Session+CSRF确认
      responses:
        '201':
          description: 成功；业务载荷见Registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
              example:
                code: OK
                message: 成功
                data:
                  account:
                    id: '101'
                    username: 示例用户_01
                    role: USER
                  nextAction: LOGIN
                requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '400':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: 请求字段不符合规则
                  value:
                    code: VALIDATION_FAILED
                    message: 请求字段不符合规则
                    data:
                      fieldErrors:
                      - field: username
                        code: VALUE_INVALID
                        message: 字段值不符合接口约定
                      activeSessionId: null
                      currentVersion: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '403':
          description: CSRF_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CSRF_INVALID:
                  summary: CSRF校验失败，请重新获取令牌
                  value:
                    code: CSRF_INVALID
                    message: CSRF校验失败，请重新获取令牌
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNSUPPORTED_MEDIA_TYPE:
                  summary: 不支持的请求或图片格式
                  value:
                    code: UNSUPPORTED_MEDIA_TYPE
                    message: 不支持的请求或图片格式
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '409':
          description: USERNAME_TAKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USERNAME_TAKEN:
                  summary: 用户名已被使用
                  value:
                    code: USERNAME_TAKEN
                    message: 用户名已被使用
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  summary: 服务暂时无法完成请求
                  value:
                    code: INTERNAL_ERROR
                    message: 服务暂时无法完成请求
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
        '503':
          description: SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SERVICE_UNAVAILABLE:
                  summary: 服务暂不可用
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: 服务暂不可用
                    data: null
                    requestId: 4aca43db-cd49-4b77-9abc-7e3490b55185
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: 示例用户_01
              password: '123456'
              confirmPassword: '123456'
      x-csrf-required: true
