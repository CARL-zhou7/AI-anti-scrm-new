      operationId: reviseDraft
      description: '校验draftId与expectedRevisionNo后原地提升修订号，仍处于待确认状态；内容不通过校验返回400，要求content字段错误码CONTENT_REJECTED；
        旧轮草稿返回409 STALE_DRAFT，修订号过期返回409 DRAFT_REVISION_CONFLICT。'
      security:
      - SessionCookie: []
        CsrfHeader: []
      parameters:
