        clientReceiveMonotonicMs:
          type: number
          minimum: 0
          description: 客户端收到采样响应时的单调时钟毫秒值
        clientClickMonotonicMs:
          type: number
          minimum: 0
          description: 用户点击开始演绎时的单调时钟毫秒值
      required:
      - methodVersion
      - sampleId
