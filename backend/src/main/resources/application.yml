spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/anti_scam?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:anti_scam_app}
    password: ${DB_PASSWORD:${MYSQL_APP_PASSWORD:}}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        connection.isolation: 2
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    async:
      # Keep in step with app.simulation.sse.emitter-timeout-ms (TBD-04).
      request-timeout: 1800000
server:
  tomcat:
    max-swallow-size: -1
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        path: /anti.scam/v1
        http-only: true
        same-site: lax
        secure: ${app.security.session-cookie-secure}
  error:
    include-message: never
    include-stacktrace: never
  port: 8100
app:
  content:
    avatar-store: ${AVATAR_STORE:var}
    startup-check:
      enabled: true
  security:
    session-cookie-secure: true
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  simulation:
    max-active-duration-ms: ${SIMULATION_MAX_ACTIVE_DURATION_MS:1800000}
    timing:
      sample-ttl-ms: 60000          # TBD-01a
      max-uncertainty-ms: 1500      # TBD-01a
      max-click-to-arrival-ms: 30000 # TBD-01a
    llm:
      provider: ${LLM_PROVIDER:deepseek}   # deepseek | scripted (scripted only in dev/test)
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      model: ${LLM_MODEL:deepseek-chat}
      api-key: ${LLM_API_KEY:}
      call-timeout-ms: 20000
      transient-retries: 2
      max-tokens: 800
    tts:
      provider: ${TTS_PROVIDER:qwen}  # qwen | silent (silent only in dev/test)
      qwen-base-url: ${QWEN_TTS_BASE_URL:}
      qwen-api-key: ${QWEN_API_KEY:}
      qwen-model: ${QWEN_TTS_MODEL:qwen-audio-3.1-tts-flash}
      qwen-region: ${QWEN_TTS_REGION:beijing}
      call-timeout-ms: 30000
      # V-09: user-confirmed 2026-10-22; neutral groups reuse the corresponding male pair.
      voices:
        - { id: "${QWEN_VOICE_YOUTH_MALE_PRIMARY:longanyang_v3.1}", age-group: YOUTH, gender: MALE, rank: PRIMARY }
        - { id: "${QWEN_VOICE_YOUTH_MALE_BACKUP:longanlang_v3.1}", age-group: YOUTH, gender: MALE, rank: BACKUP }
        - { id: "${QWEN_VOICE_YOUTH_FEMALE_PRIMARY:anruorou_v3.1}", age-group: YOUTH, gender: FEMALE, rank: PRIMARY }
        - { id: "${QWEN_VOICE_YOUTH_FEMALE_BACKUP:longyingtao_v3.1}", age-group: YOUTH, gender: FEMALE, rank: BACKUP }
        - { id: "${QWEN_VOICE_YOUTH_NEUTRAL_PRIMARY:longanyang_v3.1}", age-group: YOUTH, gender: NEUTRAL, rank: PRIMARY }
        - { id: "${QWEN_VOICE_YOUTH_NEUTRAL_BACKUP:longanlang_v3.1}", age-group: YOUTH, gender: NEUTRAL, rank: BACKUP }
        - { id: "${QWEN_VOICE_MIDDLE_MALE_PRIMARY:longanlang_v3.1}", age-group: MIDDLE, gender: MALE, rank: PRIMARY }
        - { id: "${QWEN_VOICE_MIDDLE_MALE_BACKUP:longzhe_v3.1}", age-group: MIDDLE, gender: MALE, rank: BACKUP }
        - { id: "${QWEN_VOICE_MIDDLE_FEMALE_PRIMARY:longyingtao_v3.1}", age-group: MIDDLE, gender: FEMALE, rank: PRIMARY }
        - { id: "${QWEN_VOICE_MIDDLE_FEMALE_BACKUP:anruorou_v3.1}", age-group: MIDDLE, gender: FEMALE, rank: BACKUP }
        - { id: "${QWEN_VOICE_MIDDLE_NEUTRAL_PRIMARY:longanlang_v3.1}", age-group: MIDDLE, gender: NEUTRAL, rank: PRIMARY }
        - { id: "${QWEN_VOICE_MIDDLE_NEUTRAL_BACKUP:longzhe_v3.1}", age-group: MIDDLE, gender: NEUTRAL, rank: BACKUP }
        - { id: "${QWEN_VOICE_SENIOR_MALE_PRIMARY:libai_v3.1}", age-group: SENIOR, gender: MALE, rank: PRIMARY }
        - { id: "${QWEN_VOICE_SENIOR_MALE_BACKUP:longzhe_v3.1}", age-group: SENIOR, gender: MALE, rank: BACKUP }
        - { id: "${QWEN_VOICE_SENIOR_FEMALE_PRIMARY:longyingtao_v3.1}", age-group: SENIOR, gender: FEMALE, rank: PRIMARY }
        - { id: "${QWEN_VOICE_SENIOR_FEMALE_BACKUP:anruorou_v3.1}", age-group: SENIOR, gender: FEMALE, rank: BACKUP }
        - { id: "${QWEN_VOICE_SENIOR_NEUTRAL_PRIMARY:libai_v3.1}", age-group: SENIOR, gender: NEUTRAL, rank: PRIMARY }
        - { id: "${QWEN_VOICE_SENIOR_NEUTRAL_BACKUP:longzhe_v3.1}", age-group: SENIOR, gender: NEUTRAL, rank: BACKUP }
    audio-temp-dir: ${AUDIO_TEMP_DIR:var/tmp-audio}
    sse:
      heartbeat-ms: 15000           # TBD-04
      emitter-timeout-ms: 1800000   # TBD-04
    connection:
      lost-grace-ms: 30000          # TBD-05
    executors:
      lanes: 8
    report-attempt-timeout-ms: 120000
    report:
      enabled: true
      poll-ms: 1000
      max-concurrent: 4
      initial-delay-ms: 2000
